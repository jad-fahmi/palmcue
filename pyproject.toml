[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palmcue"
version = "0.1.0"
description = "Quiet, deliberate hand controls for your presentation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "mediapipe>=0.10.30,<0.11",
  "opencv-contrib-python>=4.11,<5",
  "numpy>=2,<3",
]

[project.gui-scripts]
palmcue = "palmcue.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.12", "pyinstaller>=6.15,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/palmcue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
