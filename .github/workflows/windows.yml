name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked
      - name: Test and lint
        run: |
          uv run ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run ruff format --check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build offline Windows application and installer
        run: uv run python scripts/build_windows.py --iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Smoke test frozen application
        run: |
          $app = Start-Process -FilePath dist/PalmCue/PalmCue.exe -ArgumentList '--self-test',"$PWD/build/frozen-check.json" -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(90000)) { $app.Kill(); throw 'Frozen application timed out' }
          Get-Content build/frozen-check.json
          if ($app.ExitCode -ne 0) { throw 'Frozen application self-test failed' }
          if (-not (Get-Content build/frozen-check.json | ConvertFrom-Json).ok) { throw 'Self-test did not pass' }
      - uses: actions/upload-artifact@v4
        with:
          name: PalmCue-windows-x64-unsigned
          path: |
            dist/*.zip
            dist/*Setup*.exe
            build/frozen-check.json
